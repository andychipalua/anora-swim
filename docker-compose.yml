services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root-change-me}
      MYSQL_DATABASE: anora_swim
      MYSQL_USER: ${DB_USER:-anora}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change-me}
    volumes:
      - mysql_data:/var/lib/mysql
      # Run once, the first time the volume is created (alphabetical order)
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  api:
    build: ./api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER:-anora}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      DB_NAME: anora_swim
      # Writes (POST) are only accepted with this key; only the web container knows it
      API_WRITE_KEY: ${API_WRITE_KEY:?Set API_WRITE_KEY in your .env file}

  web:
    build: .
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:3000"
    environment:
      # The Next.js server calls the PHP API over Docker's internal network
      API_BASE_URL: http://api
      API_WRITE_KEY: ${API_WRITE_KEY:?Set API_WRITE_KEY in your .env file}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in your .env file}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in your .env file}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      NEXT_PUBLIC_SWIMMER_NAME: ${NEXT_PUBLIC_SWIMMER_NAME:-Anora}
      NEXT_PUBLIC_CLUB_NAME: ${NEXT_PUBLIC_CLUB_NAME:-Your Club Name}

volumes:
  mysql_data:
