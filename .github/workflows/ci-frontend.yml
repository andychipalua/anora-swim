name: Frontend build check

# anora.chipalu.com is deployed by Hostinger itself (Node.js Web App connected to this repo,
# auto-redeploys on every push to main). This workflow catches a broken build before it
# reaches that point and on every pull request.
on:
  push:
    branches: [main]
    paths-ignore: ["api/**", "db/**", "*.md"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          API_BASE_URL: https://api.chipalu.com
